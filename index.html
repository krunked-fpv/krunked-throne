<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#08060c" />
    <meta name="format-detection" content="telephone=no" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23130e1c'/%3E%3Crect x='3' y='3' width='10' height='10' fill='%2352e864'/%3E%3Crect x='5' y='5' width='6' height='6' fill='%23ffe047'/%3E%3C/svg%3E"
    />
    <title>KRUNKED THRONE</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        position: fixed;
        inset: 0;
        width: 100vw;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        background: #08060c;
        overflow: hidden;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-text-size-adjust: 100%;
        touch-action: none;
      }

      #app {
        position: fixed;
        inset: 0;
        width: 100vw;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #14101c 0%, #08060c 72%);
        overflow: hidden;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
      }

      #game-canvas {
        display: block;
        margin: auto;
        max-width: 100%;
        max-height: 100%;
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-crisp-edges;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        box-shadow: 0 0 0 2px #1c1626, 0 12px 48px rgba(0, 0, 0, 0.85);
        background: #0a090d;
        user-select: none;
        -webkit-user-select: none;
        -webkit-user-drag: none;
        -webkit-touch-callout: none;
        touch-action: none;
        outline: none;
      }

      #game-canvas.hide-cursor {
        cursor: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" width="320" height="240"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
