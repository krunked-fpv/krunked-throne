<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>KRUNKED THRONE</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background: #08060c;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }

      #app {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #14101c 0%, #08060c 72%);
        overflow: hidden;
      }

      #game-canvas {
        display: block;
        max-width: 100vw;
        max-height: 100vh;
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-crisp-edges;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        box-shadow: 0 0 0 2px #1c1626, 0 12px 48px rgba(0, 0, 0, 0.85);
        background: #0a090d;
      }

      #game-canvas.hide-cursor {
        cursor: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" width="320" height="240"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
